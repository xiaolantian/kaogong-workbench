<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="bodyFocus" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ede7ff"/>
    </radialGradient>
  </defs>
  <!-- Ears -->
  <ellipse cx="32" cy="38" rx="10" ry="13" fill="url(#bodyFocus)" transform="rotate(-25 32 38)"/>
  <ellipse cx="88" cy="38" rx="10" ry="13" fill="url(#bodyFocus)" transform="rotate(25 88 38)"/>
  <ellipse cx="32" cy="38" rx="5" ry="7" fill="#a29bfe" opacity="0.6" transform="rotate(-25 32 38)"/>
  <ellipse cx="88" cy="38" rx="5" ry="7" fill="#a29bfe" opacity="0.6" transform="rotate(25 88 38)"/>

  <!-- Body -->
  <path d="M60 22 C 90 22, 102 50, 102 72 C 102 96, 82 108, 60 108 C 38 108, 18 96, 18 72 C 18 50, 30 22, 60 22 Z" fill="url(#bodyFocus)"/>

  <!-- Eyes (normal, focused) -->
  <circle cx="44" cy="65" r="7" fill="#2d3436"/>
  <circle cx="76" cy="65" r="7" fill="#2d3436"/>
  <circle cx="46" cy="63" r="2.5" fill="white"/>
  <circle cx="78" cy="63" r="2.5" fill="white"/>

  <!-- Cheeks -->
  <ellipse cx="30" cy="78" rx="6" ry="3.5" fill="#ff7675" opacity="0.35"/>
  <ellipse cx="90" cy="78" rx="6" ry="3.5" fill="#ff7675" opacity="0.35"/>

  <!-- Mouth (small smile) -->
  <path d="M52 82 Q 60 88 68 82" stroke="#2d3436" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Nose -->
  <ellipse cx="60" cy="76" rx="2.5" ry="1.8" fill="#ff7675"/>
</svg>
