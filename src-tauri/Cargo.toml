[package]
name = "kaogong-workbench"
version = "0.1.0"
edition = "2021"

[lib]
name = "kaogong_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.0", features = ["shell-open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
